version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: minly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: minly
      POSTGRES_PASSWORD: minly_password
      POSTGRES_DB: minly_db
    ports:
      - "5432:5432"

  backend:
    build: .
    container_name: minly-backend
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      # overrides .env so the container talks to the compose postgres
      DATABASE_URL: postgresql://minly:minly_password@postgres:5432/minly_db
      PORT: "4000"
    ports:
      - "4000:4000"
